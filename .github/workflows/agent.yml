name: Job Agent Svizzera

on:
  schedule:
    - cron: '0 6 * * 1-5'   # Lun–Ven 06:00 ora CH
  workflow_dispatch:        # Avvio manuale

jobs:
  search_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepara cartella risultati
        run: |
          mkdir -p risultati
          TS=$(date +'%Y-%m-%d')
          echo "RISULTATI – ${TS}" > risultati/risultati-${TS}.txt
          echo "" >> risultati/risultati-${TS}.txt
          echo "Filtro: Senior · SAP · Svizzera" >> risultati/risultati-${TS}.txt
          echo "Fonte: pagine pubbliche (job boards/aziende)" >> risultati/risultati-${TS}.txt
          echo "" >> risultati/risultati-${TS}.txt

      # ─────────────────────────────────────────────────────────────
      #  SORGENTI PUBBLICHE (SEMPLICI) — aggiungi/rimuovi a piacere
      #  NB: usiamo curl + grep per estrarre titoli con SAP/Senior/Analyst/Consultant
      # ─────────────────────────────────────────────────────────────

      - name: Estrai da jobs.ch (query SAP Business Process Analysis)
        run: |
          TS=$(date +'%Y-%m-%d')
          URL="https://www.jobs.ch/en/vacancies/?term=SAP%20Business%20Process%20Analysis"
          echo ">>> jobs.ch" >> risultati/risultati-${TS}.txt
          (curl -sL "$URL" \
            | sed 's/<[^>]*>/ /g' \
            | tr -s ' ' \
            | grep -Ei 'SAP|S/4|Business Analyst|Process|Consultant' \
            | grep -Ei 'Senior|Lead|Manager|80|90|100' \
            | head -n 20 \
            | sed 's/^/- /') >> risultati/risultati-${TS}.txt
          echo "" >> risultati/risultati-${TS}.txt

      - name: Estrai da jobs.ch (query SAP Business Analyst)
        run: |
          TS=$(date +'%Y-%m-%d')
          URL="https://www.jobs.ch/de/stellenangebote/?term=sap-business-analyst"
          echo ">>> jobs.ch (DE – sap-business-analyst)" >> risultati/risultati-${TS}.txt
          (curl -sL "$URL" \
            | sed 's/<[^>]*>/ /g' \
            | tr -s ' ' \
            | grep -Ei 'SAP|S/4|FI|CO|MM|SD|BW|Process' \
            | grep -Ei 'Senior|Lead|Manager|80|90|100' \
            | head -n 20 \
            | sed 's/^/- /') >> risultati/risultati-${TS}.txt
          echo "" >> risultati/risultati-${TS}.txt

      - name: Estrai da JobScout24 (query SAP business analyst)
        run: |
          TS=$(date +'%Y-%m-%d')
          URL="https://www.jobscout24.ch/en/jobs/sap%20business%20analyst/"
          echo ">>> JobScout24" >> risultati/risultati-${TS}.txt
          (curl -sL "$URL" \
            | sed 's/<[^>]*>/ /g' \
            | tr -s ' ' \
            | grep -Ei 'SAP|S/4|Business Analyst|Process|Consultant|FI|CO|MM|SD' \
            | grep -Ei 'Senior|Lead|80|90|100' \
            | head -n 20 \
            | sed 's/^/- /') >> risultati/risultati-${TS}.txt
          echo "" >> risultati/risultati-${TS}.txt

      - name: Estrai da LinkedIn (pagina elenco – anteprima)
        run: |
          TS=$(date +'%Y-%m-%d')
          URL="https://ch.linkedin.com/jobs/senior-analyst-sap-business-stellen"
          echo ">>> LinkedIn (elenco, anteprima testo)" >> risultati/risultati-${TS}.txt
          (curl -sL "$URL" \
            | sed 's/<[^>]*>/ /g' \
            | tr -s ' ' \
            | grep -Ei 'SAP|S/4|Business|Analyst|Process|Consultant|Finance|BW' \
            | grep -Ei 'Senior' \
            | head -n 20 \
            | sed 's/^/- /') >> risultati/risultati-${TS}.txt
          echo "" >> risultati/risultati-${TS}.txt

      # ─────────────────────────────────────────────────────────────
      #  PULIZIA/DEDUPLICA MINIMA + TAG MATCH
      # ─────────────────────────────────────────────────────────────
      - name: Deduplca e marca righe rilevanti
        run: |
          TS=$(date +'%Y-%m-%d')
          FILE="risultati/risultati-${TS}.txt"
          awk '!seen[$0]++' "$FILE" > "${FILE}.dedup"
          mv "${FILE}.dedup" "$FILE"
          echo "" >> "$FILE"
          echo "Tag filtrati: [Senior] [SAP] [CH]" >> "$FILE"

      # ─────────────────────────────────────────────────────────────
      #  SALVA COME ARTIFACT (visibile in Actions)
      # ─────────────────────────────────────────────────────────────
      - name: Pubblica artifact dei risultati
        uses: actions/upload-artifact@v4
        with:
          name: risultati-${{ github.run_id }}
          path: risultati/

      # ─────────────────────────────────────────────────────────────
      #  COMMIT NEL REPO (storico risultati/)
      # ─────────────────────────────────────────────────────────────
      - name: Commit dei risultati nel repository
        run: |
          TS=$(date +'%Y-%m-%d')
          git config user.name "job-agent"
          git config user.email "job-agent@users.noreply.github.com"
          git add risultati/risultati-${TS}.txt
          git commit -m "Add risultati ${TS}" || echo "Niente da committare"
          git push
